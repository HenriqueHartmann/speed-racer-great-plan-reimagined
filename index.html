<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speed Racer: The Great Plan — Reimagined</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #0b0d10; font-family: ui-monospace, monospace; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; left: 16px; top: 16px; padding: 10px 14px;
        background: rgba(10,12,16,.72); border: 1px solid rgba(255,255,255,.14);
        border-radius: 8px; color: #e8ecf2; font-size: 13px; letter-spacing: .02em;
        white-space: pre; pointer-events: none;
      }
      #help {
        position: fixed; left: 16px; bottom: 16px; padding: 10px 14px;
        background: rgba(10,12,16,.72); border: 1px solid rgba(255,255,255,.14);
        border-radius: 8px; color: #9aa4b2; font-size: 12px; line-height: 1.6;
        pointer-events: none;
      }
      .error {
        position: fixed; inset: 24px; padding: 16px; overflow: auto;
        background: #2a1416; border: 1px solid #a33; border-radius: 8px;
        color: #ffb4b4; font-size: 13px; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">loading…</div>
    <div id="help">W/A/S/D or arrows — drive · Space — Jacks<br />Placeholder car: the original mesh encoding is not decoded.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
